site_name: Base de Conocimiento - Erick Sang
site_description: Repositorio personal de aprendizajes sobre Data, Desarrollo, DevOps y Tecnología
site_author: Erick Sang
site_url: https://leonsang.github.io

repo_name: leonsang/leonsang
repo_url: https://github.com/leonsang/leonsang

theme:
  name: material
  language: es
  features:
    # Navegación
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking

    # Tabla de contenidos
    - toc.follow
    - toc.integrate

    # Búsqueda
    - search.highlight
    - search.suggest
    - search.share

    # Contenido
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

  palette:
    # Modo claro (predeterminado) - esquema Material original
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    # Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    logo: material/database
    repo: fontawesome/brands/github

  favicon: assets/images/favicon.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leonsang
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/erick-sang

  generator: false

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: es
  # - minify:
  #     minify_html: true
  # - git-revision-date-localized:
  #     type: date
  #     locale: es
  - mkdocs-jupyter:
      execute: false
      allow_errors: false
      ignore_h1_titles: true
      show_input: true
      show_output: true
      no_input: false
      include_requirejs: true
      include_source: true
      theme: dark
      kernel_name: python3

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: Contenido
  - tables

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
